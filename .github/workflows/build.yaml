name: Build
on:
  push:
    branches: [master]
  pull_request:
    types: [opened, reopened, labeled, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  BuildWithCMake:
    runs-on: ${{ matrix.os || 'ubuntu-latest' }}

    strategy:
     fail-fast: false
     matrix:
       include:
         - name: Clang Shared
           cc: clang
           cxx: clang++
           cflags: -Wall -fcolor-diagnostics -fansi-escape-codes
           shared: 'true'
         - name: Clang Static
           cc: clang
           cxx: clang++
           cflags: -Wall -fcolor-diagnostics -fansi-escape-codes -O2 -Werror=strict-aliasing
         - name: GCC Static
           cc: gcc
           cxx: g++
           cflags: -Wall -fdiagnostics-color=always -O2 -Werror=strict-aliasing
         - name: MSVC
           os: windows-latest
           cmake_args: >-
             -G "Visual Studio 18 2026" -A x64
           cmake_build_options: >-
             --config Release
         - name: OSX
           os: macos-latest

    env:
      CC: ${{ matrix.cc || (matrix.os == 'windows-latest' && 'cl' || 'cc') }}
      CXX: ${{ matrix.cxx || (matrix.os == 'windows-latest' && 'cl' || 'c++') }}
      CFLAGS: ${{ matrix.cflags || '-Wall' }}
      CXXFLAGS: ${{ matrix.cflags || '-Wall' }}
      SHARED: ${{ matrix.shared || 'false' }}

    steps:
    - name: Checkout the source
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 1
    - uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    - uses: ilammy/msvc-dev-cmd@v1
      if: runner.os == 'Windows'
    - name: Install build tools
      shell: bash
      run: |
        python -m pip install meson ninja
        if [ "$RUNNER_OS" = Windows ]; then
          choco install pkgconfiglite -y
        elif [ "$RUNNER_OS" = macOS ]; then
          brew install pkgconf
        else
          sudo apt-get update
          sudo apt-get install -y pkg-config
        fi
    - name: Build and install libfaad3
      shell: bash
      run: |
        vsenv=""
        if [ "$RUNNER_OS" = Windows ]; then
          # Git's GNU link.exe shadows MSVC's linker in a bash step.
          rm -f /usr/bin/link.exe
          vsenv="--vsenv"
        fi
        meson setup faac-build external/faac $vsenv --prefix="$RUNNER_TEMP/usrlocal" --libdir=lib -Dbuildtype=release -Ddecoder=true
        ninja -C faac-build install
        echo "PKG_CONFIG_PATH=$RUNNER_TEMP/usrlocal/lib/pkgconfig" >> "$GITHUB_ENV"
    - name: Configure and build
      shell: bash
      run: |
        cmake -S . -B build \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/usrlocal" \
            -DBUILD_SHARED_LIBS=${SHARED} \
            ${{ matrix.cmake_args }}
        cmake --build build --parallel ${{ matrix.cmake_build_options || '' }}
        cmake --install build ${{ matrix.cmake_build_options || '' }}

  BuildOnMsys:
    name: BuildOnMsys (${{ matrix.msystem }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
         - msystem: ucrt64
    defaults:
      run:
        shell: msys2 {0}
    steps:
    - name: Checkout the source
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 1
    - uses: msys2/setup-msys2@v2
      with:
        msystem: ${{ matrix.msystem }}
        update: true
        path-type: inherit
        install: >-
          base-devel
        pacboy: >-
          cmake:p
          meson:p
          ninja:p
          pkgconf:p
          gcc:p
    - name: Build and install libfaad3
      run: |
        meson setup faac-build external/faac --prefix="$(pwd)/temp" --libdir=lib -Dbuildtype=release -Ddecoder=true
        ninja -C faac-build install
    - name: Configure and build
      run: |
        export PKG_CONFIG_PATH="$(pwd)/temp/lib/pkgconfig"
        cmake -S . -B build \
            -DCMAKE_INSTALL_PREFIX="$(pwd)/temp" \
            -DBUILD_SHARED_LIBS=ON
        cmake --build build --parallel
        cmake --install build
    - name: Upload artifacts (Windows)
      uses: actions/upload-artifact@v4
      if: runner.os == 'Windows'
      with:
        name: faad2-${{ github.sha }}-${{ matrix.msystem }}
        path: temp
